<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>登录 · 浦江一中拓展课 系统</title>
<style>
  /* ===== 全局重置 ===== */
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  :root {
    /* 与选课页面保持一致的蓝绿色系主色调 */
    --primary: #0d9488;
    --primary-light: #14b8a6;
    --primary-dark: #0f766e;
    --accent: #0ea5e9;
    --gold: #F5A623;
    --gold-light: #FFB940;
    --bg-deep: #042f2e;
    --bg-mid: #0f766e;
    --text: #ffffff;
    --text-dim: rgba(255,255,255,0.72);
    --text-muted: rgba(255,255,255,0.5);
    --glass: rgba(255,255,255,0.12);
    --glass-border: rgba(255,255,255,0.22);
    --danger: #ef4444;
    --success: #10b981;
  }

  html, body {
    height: 100%;
    width: 100%;
    font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    color: var(--text);
    overflow: hidden;
  }

  /* ===== 动态背景：多层渐变 + 流动光斑 ===== */
  body {
    position: relative;
    background:
      radial-gradient(ellipse 80% 60% at 20% 20%, rgba(20,184,166,0.35), transparent 60%),
      radial-gradient(ellipse 70% 50% at 80% 80%, rgba(14,165,233,0.30), transparent 60%),
      radial-gradient(ellipse 60% 40% at 50% 50%, rgba(245,166,35,0.12), transparent 70%),
      linear-gradient(135deg, #042f2e 0%, #0f766e 40%, #0d9488 70%, #042f2e 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  /* 流动光斑层（缓慢飘移） */
  .bg-orbs {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
  }
  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(60px);
    opacity: 0.55;
    animation: orbFloat 18s ease-in-out infinite;
  }
  .orb-1 {
    width: 480px; height: 480px;
    background: radial-gradient(circle, #14b8a6, transparent 70%);
    top: -120px; left: -120px;
    animation-delay: 0s;
  }
  .orb-2 {
    width: 420px; height: 420px;
    background: radial-gradient(circle, #0ea5e9, transparent 70%);
    bottom: -100px; right: -80px;
    animation-delay: -6s;
  }
  .orb-3 {
    width: 360px; height: 360px;
    background: radial-gradient(circle, #F5A623, transparent 70%);
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    opacity: 0.25;
    animation-delay: -12s;
  }
  @keyframes orbFloat {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33%      { transform: translate(60px, -40px) scale(1.08); }
    66%      { transform: translate(-50px, 50px) scale(0.95); }
  }
  .orb-3 {
    animation-name: orbFloatCenter;
  }
  @keyframes orbFloatCenter {
    0%, 100% { transform: translate(-50%, -50%) scale(1); }
    50%      { transform: translate(-50%, -50%) scale(1.15); }
  }

  /* 粒子点阵（细微闪烁） */
  .bg-stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    background-image:
      radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,0.6), transparent),
      radial-gradient(1px 1px at 60% 70%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1px 1px at 80% 20%, rgba(255,255,255,0.7), transparent),
      radial-gradient(1px 1px at 30% 80%, rgba(255,255,255,0.4), transparent),
      radial-gradient(1px 1px at 90% 50%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1.5px 1.5px at 45% 45%, rgba(255,255,255,0.6), transparent),
      radial-gradient(1px 1px at 70% 90%, rgba(255,255,255,0.4), transparent),
      radial-gradient(1px 1px at 10% 60%, rgba(255,255,255,0.5), transparent);
    background-size: 100% 100%;
    animation: starsTwinkle 4s ease-in-out infinite;
  }
  @keyframes starsTwinkle {
    0%, 100% { opacity: 0.5; }
    50%      { opacity: 1; }
  }

  /* ===== 登录卡片 ===== */
  .login-wrap {
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 920px;
    display: flex;
    border-radius: 28px;
    overflow: hidden;
    background: var(--glass);
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    border: 1px solid var(--glass-border);
    box-shadow:
      0 30px 80px rgba(0,0,0,0.45),
      0 8px 24px rgba(13,148,136,0.25),
      inset 0 1px 0 rgba(255,255,255,0.18);
    animation: cardIn 0.9s cubic-bezier(0.34, 1.4, 0.64, 1) both;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(40px) scale(0.94); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* ===== 左侧品牌区 ===== */
  .brand-side {
    flex: 1.1;
    position: relative;
    padding: 44px 38px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    background:
      linear-gradient(160deg, rgba(15,118,110,0.55) 0%, rgba(4,47,46,0.65) 100%);
    overflow: hidden;
  }
  /* 品牌区装饰：右上角金色弧光 */
  .brand-side::before {
    content: "";
    position: absolute;
    top: -80px; right: -80px;
    width: 260px; height: 260px;
    background: radial-gradient(circle, rgba(245,166,35,0.35), transparent 65%);
    border-radius: 50%;
    pointer-events: none;
    animation: brandGlow 6s ease-in-out infinite;
  }
  @keyframes brandGlow {
    0%, 100% { opacity: 0.55; transform: scale(1); }
    50%      { opacity: 0.85; transform: scale(1.1); }
  }
  /* 品牌区装饰：左下角青色波纹 */
  .brand-side::after {
    content: "";
    position: absolute;
    bottom: -60px; left: -60px;
    width: 220px; height: 220px;
    background: radial-gradient(circle, rgba(20,184,166,0.4), transparent 65%);
    border-radius: 50%;
    pointer-events: none;
    animation: brandGlow 8s ease-in-out infinite reverse;
  }

  .brand-logo {
    display: flex;
    align-items: center;
    gap: 14px;
    position: relative;
    z-index: 2;
    animation: brandItemIn 0.7s 0.2s cubic-bezier(0.34, 1.4, 0.64, 1) both;
  }
  .brand-logo .logo-mark {
    position: relative;
    flex-shrink: 0;
    width: 56px;
    height: 56px;
  }
  .brand-logo .logo-img {
    width: 56px;
    height: 56px;
    object-fit: contain;
    display: block;
    border-radius: 50%;
    filter: drop-shadow(0 4px 12px rgba(245,166,35,0.45));
    animation: logoBreath 2.8s ease-in-out infinite;
    transform-origin: 50% 50%;
    will-change: transform, filter;
  }
  .brand-logo .logo-ring {
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    border: 2px solid rgba(245, 166, 35, 0.55);
    animation: logoRipple 2.8s ease-out infinite;
    pointer-events: none;
  }
  .brand-logo .logo-ring-2 {
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    border: 1.5px solid rgba(255, 185, 64, 0.4);
    animation: logoRipple 2.8s 0.9s ease-out infinite;
    pointer-events: none;
  }
  @keyframes logoBreath {
    0%, 100% {
      transform: translateY(0) scale(1);
      filter: drop-shadow(0 4px 12px rgba(245,166,35,0.4));
    }
    50% {
      transform: translateY(-5px) scale(1.06);
      filter: drop-shadow(0 8px 20px rgba(245,166,35,0.75));
    }
  }
  @keyframes logoRipple {
    0% { transform: scale(0.9); opacity: 0.8; }
    70% { transform: scale(1.28); opacity: 0; }
    100% { transform: scale(1.28); opacity: 0; }
  }
  .brand-logo .logo-text {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .brand-logo .logo-text .cn {
    font-size: 15px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 1px;
  }
  .brand-logo .logo-text .en {
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 0.5px;
  }

  .brand-hero {
    position: relative;
    z-index: 2;
    animation: brandItemIn 0.7s 0.4s cubic-bezier(0.34, 1.4, 0.64, 1) both;
    min-width: 0;
  }
  .brand-hero h1 {
    font-size: clamp(22px, 2.6vw, 32px);
    font-weight: 900;
    line-height: 1.25;
    letter-spacing: 2px;
    margin-bottom: 14px;
    white-space: nowrap;
    background: linear-gradient(90deg, #ffffff 0%, #FFB940 50%, #ffffff 100%);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: textShine 5s linear infinite;
  }
  @keyframes textShine {
    to { background-position: 200% center; }
  }
  .brand-hero p {
    font-size: 14px;
    color: var(--text-dim);
    line-height: 1.8;
    letter-spacing: 1px;
    white-space: nowrap;
  }

  .brand-features {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    gap: 14px;
    animation: brandItemIn 0.7s 0.6s cubic-bezier(0.34, 1.4, 0.64, 1) both;
  }
  .feature-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    border-radius: 12px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    transition: transform 0.3s, background 0.3s;
  }
  .feature-item:hover {
    transform: translateX(6px);
    background: rgba(255,255,255,0.12);
  }
  .feature-icon {
    width: 32px; height: 32px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
    background: linear-gradient(135deg, var(--primary-light), var(--accent));
    box-shadow: 0 4px 12px rgba(20,184,166,0.4);
  }
  .feature-text {
    font-size: 13px;
    color: var(--text-dim);
    letter-spacing: 0.5px;
  }
  .feature-text strong {
    color: #fff;
    font-weight: 700;
  }

  .brand-footer {
    position: relative;
    z-index: 2;
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 1px;
    animation: brandItemIn 0.7s 0.8s cubic-bezier(0.34, 1.4, 0.64, 1) both;
  }

  @keyframes brandItemIn {
    from { opacity: 0; transform: translateX(-30px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  /* ===== 右侧表单区 ===== */
  .form-side {
    flex: 1;
    padding: 48px 44px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    background: rgba(255,255,255,0.05);
    animation: formIn 0.7s 0.3s cubic-bezier(0.34, 1.4, 0.64, 1) both;
  }
  @keyframes formIn {
    from { opacity: 0; transform: translateX(30px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  .form-title {
    margin-bottom: 8px;
    font-size: 26px;
    font-weight: 800;
    color: #fff;
    letter-spacing: 2px;
  }
  .form-subtitle {
    margin-bottom: 32px;
    font-size: 13px;
    color: var(--text-dim);
    letter-spacing: 1px;
  }

  /* 输入框组 */
  .field {
    margin-bottom: 20px;
    position: relative;
  }
  .field-label {
    display: block;
    margin-bottom: 8px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-dim);
    letter-spacing: 1px;
  }
  .input-wrap {
    position: relative;
    display: flex;
    align-items: center;
  }
  .input-icon {
    position: absolute;
    left: 16px;
    width: 18px;
    height: 18px;
    color: var(--text-muted);
    pointer-events: none;
    transition: color 0.3s;
    z-index: 2;
  }
  .input-wrap input {
    width: 100%;
    padding: 14px 16px 14px 46px;
    border: 1.5px solid rgba(255,255,255,0.15);
    border-radius: 12px;
    background: rgba(255,255,255,0.07);
    color: #fff;
    font-size: 15px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.3s, background 0.3s, box-shadow 0.3s;
  }
  .input-wrap input::placeholder {
    color: rgba(255,255,255,0.35);
  }
  .input-wrap input:focus {
    border-color: var(--primary-light);
    background: rgba(255,255,255,0.12);
    box-shadow: 0 0 0 4px rgba(20,184,166,0.18);
  }
  .input-wrap input:focus + .input-icon,
  .input-wrap input:focus ~ .input-icon {
    color: var(--primary-light);
  }
  /* 输入框聚焦时底部流光线条 */
  .input-wrap::after {
    content: "";
    position: absolute;
    bottom: 0;
    left: 50%;
    width: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--primary-light), var(--accent), transparent);
    transition: width 0.4s ease, left 0.4s ease;
    border-radius: 2px;
    pointer-events: none;
  }
  .input-wrap:focus-within::after {
    width: 100%;
    left: 0;
  }

  /* 密码可见切换 */
  .pwd-toggle {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    width: 28px;
    height: 28px;
    border: none;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color 0.2s;
    z-index: 2;
  }
  .pwd-toggle:hover { color: #fff; }

  /* 选项行 */
  .form-options {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 26px;
    font-size: 13px;
  }
  .remember {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--text-dim);
    cursor: pointer;
    user-select: none;
  }
  .remember input {
    width: 16px;
    height: 16px;
    accent-color: var(--primary-light);
    cursor: pointer;
  }
  .forgot {
    color: var(--primary-light);
    text-decoration: none;
    transition: color 0.2s;
  }
  .forgot:hover { color: var(--accent); text-decoration: underline; }

  /* 登录按钮 */
  .btn-login {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 50%, var(--accent) 100%);
    background-size: 200% auto;
    color: #fff;
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 3px;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.3s, background-position 0.5s;
    position: relative;
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(13,148,136,0.4);
  }
  .btn-login:hover {
    background-position: right center;
    transform: translateY(-2px);
    box-shadow: 0 12px 32px rgba(13,148,136,0.55);
  }
  .btn-login:active {
    transform: translateY(1px) scale(0.99);
  }
  /* 按钮波纹效果 */
  .btn-login .ripple {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,0.5);
    transform: scale(0);
    animation: rippleAnim 0.6s ease-out;
    pointer-events: none;
  }
  @keyframes rippleAnim {
    to { transform: scale(4); opacity: 0; }
  }
  /* 按钮加载态 */
  .btn-login.loading {
    pointer-events: none;
    opacity: 0.85;
  }
  .btn-login.loading .btn-text { visibility: hidden; }
  .btn-login.loading::after {
    content: "";
    position: absolute;
    top: 50%; left: 50%;
    width: 22px; height: 22px;
    margin: -11px 0 0 -11px;
    border: 2.5px solid rgba(255,255,255,0.35);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 错误提示 */
  .form-msg {
    margin-top: 16px;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    text-align: center;
    display: none;
    animation: msgShake 0.4s ease;
  }
  .form-msg.show { display: block; }
  .form-msg.error {
    background: rgba(239,68,68,0.18);
    border: 1px solid rgba(239,68,68,0.5);
    color: #fca5a5;
  }
  .form-msg.success {
    background: rgba(16,185,129,0.18);
    border: 1px solid rgba(16,185,129,0.5);
    color: #6ee7b7;
  }
  @keyframes msgShake {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-6px); }
    40%, 80% { transform: translateX(6px); }
  }

  /* 底部注册提示 */
  .form-footer {
    margin-top: 24px;
    text-align: center;
    font-size: 12px;
    color: var(--text-muted);
    letter-spacing: 1px;
  }
  .form-footer a {
    color: var(--gold-light);
    text-decoration: none;
    margin-left: 4px;
    transition: color 0.2s;
  }
  .form-footer a:hover { color: #fff; text-decoration: underline; }

  /* ===== 响应式 ===== */
  @media (max-width: 760px) {
    .login-wrap {
      flex-direction: column;
      max-width: 440px;
    }
    .brand-side {
      padding: 32px 28px 24px;
    }
    .brand-features { display: none; }
    .brand-hero h1 { font-size: 20px; letter-spacing: 1px; }
    .brand-hero p { font-size: 12px; letter-spacing: 0.5px; }
    .form-side {
      padding: 32px 28px 36px;
    }
  }
  @media (max-width: 420px) {
    body { padding: 12px; }
    .brand-side { padding: 24px 20px 20px; }
    .form-side { padding: 26px 20px 30px; }
    .form-title { font-size: 22px; }
    .brand-hero h1 { font-size: 17px; letter-spacing: 0.5px; }
    .brand-hero p { font-size: 11px; letter-spacing: 0; }
  }
</style>
</head>
<body>

<!-- 动态背景层 -->
<div class="bg-orbs">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
</div>
<div class="bg-stars"></div>

<!-- 登录卡片 -->
<div class="login-wrap" id="loginWrap">

  <!-- 左侧品牌区 -->
  <div class="brand-side">
    <div class="brand-logo">
      <div class="logo-mark">
        <span class="logo-ring" aria-hidden="true"></span>
        <span class="logo-ring-2" aria-hidden="true"></span>
        <img class="logo-img" src="images/logo.png" alt="浦江一中校徽">
      </div>
      <div class="logo-text">
        <span class="cn">上海市闵行区浦江第一中学</span>
        <span class="en">Shanghai Minhang Pujiang No.1 Middle School</span>
      </div>
    </div>

    <div class="brand-hero">
      <h1>浦江一中拓展课 系统</h1>
      <p>公平 · 便捷 · 智能，一站式完成拓展课选课与课堂管理</p>
    </div>

    <div class="brand-features">
      <div class="feature-item">
        <div class="feature-icon">📚</div>
        <div class="feature-text"><strong>30+ 门课程</strong> · 体育 / 艺术 / 人文社科全覆盖</div>
      </div>
      <div class="feature-item">
        <div class="feature-icon">✏️</div>
        <div class="feature-text"><strong>班主任选课</strong> · 按年级班级录入，实时保存并导出</div>
      </div>
      <div class="feature-item">
        <div class="feature-icon">👨‍🏫</div>
        <div class="feature-text"><strong>教师上课</strong> · 签到考勤、小红花加分与综合考核</div>
      </div>
    </div>

    <div class="brand-footer">© 浦江一中 · 技术赋能教育</div>
  </div>

  <!-- 右侧表单区 -->
  <div class="form-side">
    <h2 class="form-title">欢迎登录</h2>
    <p class="form-subtitle">请输入账号信息</p>

    <!-- 登录表单 -->
    <form id="loginForm" autocomplete="off" novalidate>
      <div class="field">
        <label class="field-label" for="username">账号</label>
        <div class="input-wrap">
          <input type="text" id="username" name="username" placeholder="请输入账号" autocomplete="off" />
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </div>
      </div>

      <div class="field">
        <label class="field-label" for="password">密码</label>
        <div class="input-wrap">
          <input type="password" id="password" name="password" placeholder="请输入密码" autocomplete="off" />
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <button type="button" class="pwd-toggle" id="pwdToggle" aria-label="显示/隐藏密码">
            <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="form-options">
        <label class="remember">
          <input type="checkbox" id="remember" /> 记住密码
        </label>
        <a href="javascript:void(0)" class="forgot" id="forgotLink">忘记密码？</a>
      </div>

      <button type="submit" class="btn-login" id="loginBtn">
        <span class="btn-text">登 录</span>
      </button>

      <div class="form-msg" id="formMsg"></div>
    </form>

    <div class="form-footer">
      遇到问题？<a href="javascript:void(0)" id="contactLink">联系管理员</a>
    </div>
  </div>
</div>

<script src="js/role-utils.js"></script>
<script>
(function () {
  'use strict';

  var form        = document.getElementById('loginForm');
  var usernameEl  = document.getElementById('username');
  var passwordEl  = document.getElementById('password');
  var rememberEl  = document.getElementById('remember');
  var loginBtn    = document.getElementById('loginBtn');
  var formMsg     = document.getElementById('formMsg');
  var pwdToggle   = document.getElementById('pwdToggle');
  var eyeIcon     = document.getElementById('eyeIcon');
  var forgotLink  = document.getElementById('forgotLink');
  var contactLink = document.getElementById('contactLink');

  /* ---------- 密码可见切换 ---------- */
  pwdToggle.addEventListener('click', function () {
    if (passwordEl.type === 'password') {
      passwordEl.type = 'text';
      eyeIcon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
    } else {
      passwordEl.type = 'password';
      eyeIcon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
    }
    passwordEl.focus();
  });

  /* ---------- 提示消息 ---------- */
  function showMsg(text, type) {
    formMsg.textContent = text;
    formMsg.className = 'form-msg show ' + (type || 'error');
    // 重新触发抖动动画
    formMsg.style.animation = 'none';
    void formMsg.offsetWidth;
    formMsg.style.animation = '';
  }
  function hideMsg() {
    formMsg.className = 'form-msg';
  }

  /* ---------- 按钮波纹效果 ---------- */
  loginBtn.addEventListener('click', function (e) {
    var rect = loginBtn.getBoundingClientRect();
    var ripple = document.createElement('span');
    ripple.className = 'ripple';
    var size = Math.max(rect.width, rect.height);
    ripple.style.width = ripple.style.height = size + 'px';
    ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
    ripple.style.top  = (e.clientY - rect.top - size / 2) + 'px';
    loginBtn.appendChild(ripple);
    setTimeout(function () { ripple.remove(); }, 600);
  });

  /* ---------- 记住密码 / 账号 ---------- */
  try {
    var savedUser = localStorage.getItem('pjyz_login_user');
    var savedRemember = localStorage.getItem('pjyz_login_remember');
    if (savedUser) {
      usernameEl.value = savedUser;
    }
    if (savedRemember === '1') {
      rememberEl.checked = true;
      var savedPass = localStorage.getItem('pjyz_login_pass');
      if (savedPass) passwordEl.value = savedPass;
    }
  } catch (_) {}

  /* ---------- API 基址（同源默认，支持前后端分离） ---------- */
  function getApiBase() {
    try {
      if (window.__API_BASE__ && typeof window.__API_BASE__ === 'string') return window.__API_BASE__;
      var saved = localStorage.getItem('pjyz_api_base');
      if (saved) return saved.replace(/\/+$/, '');
    } catch (_) {}
    return '';
  }

  /* ---------- 表单提交 ---------- */
  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    hideMsg();

    var username = usernameEl.value.trim();
    var password = passwordEl.value;

    // 简单校验
    if (!username) {
      showMsg('请输入账号', 'error');
      usernameEl.focus();
      return;
    }
    if (!password) {
      showMsg('请输入密码', 'error');
      passwordEl.focus();
      return;
    }

    // 所有账号统一走 API 验证
    loginBtn.disabled = true;
    loginBtn.textContent = '登录中...';
    try {
      var res = await fetch(getApiBase() + '/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: username, password: password })
      });
      var data = await res.json();
      if (data.success && data.token) {
        // 各端统一读取 admin_token（教师端 / 管理端 / 选课端）
        localStorage.setItem('admin_token', data.token);
        localStorage.setItem('pjyz_token', data.token);
        if (data.user) {
          localStorage.setItem('pjyz_user', JSON.stringify(data.user));
        }

        // 记住密码：勾选则保存账号+密码；未勾选仅保留账号供下次显示
        var userRole = (data.user && data.user.role) || ((data.user && data.user.roles && data.user.roles[0]) || 'teacher');
        try {
          localStorage.setItem('pjyz_login_user', username);
          if (rememberEl.checked) {
            localStorage.setItem('pjyz_login_remember', '1');
            localStorage.setItem('pjyz_login_pass', password);
          } else {
            localStorage.removeItem('pjyz_login_remember');
            localStorage.removeItem('pjyz_login_pass');
          }
          localStorage.setItem('pjyz_current_username', username);

          // 登录成功：优先进入最近打开过的页面，并写入活动角色，避免教师端再次要求登录
          var redirectUrl = 'xuanke';
          if (window.PjyzRole) {
            redirectUrl = PjyzRole.getLoginRedirectUrl(data.user);
            var pageRoleMap = { admin: 'admin', xuanke: 'banzhuren', jiaoshi: 'teacher' };
            userRole = pageRoleMap[redirectUrl] || userRole;
            if (userRole) PjyzRole.setActiveRole(userRole);
          } else if (userRole === 'admin') {
            redirectUrl = 'admin';
          } else if (userRole === 'teacher') {
            redirectUrl = 'jiaoshi';
          }
          localStorage.setItem('pjyz_login_role', userRole);
          window.location.href = redirectUrl;
          return;
        } catch (_) {
          window.location.href = (userRole === 'admin') ? 'admin' : (userRole === 'teacher' ? 'jiaoshi' : 'xuanke');
          return;
        }
      } else {
        showMsg(data.error || '登录失败', 'error');
      }
    } catch (err) {
      showMsg('登录请求失败：' + err.message, 'error');
    }
    loginBtn.disabled = false;
    loginBtn.textContent = '登 录';
  });

  /* ---------- 忘记密码 / 联系管理员 ---------- */
  forgotLink.addEventListener('click', function () {
    showMsg('请联系学校信息中心重置密码', 'error');
  });
  contactLink.addEventListener('click', function () {
    showMsg('联系方式：info@pjyz.edu.cn', 'error');
  });

  /* ---------- 输入时清除提示 ---------- */
  usernameEl.addEventListener('input', hideMsg);
  passwordEl.addEventListener('input', hideMsg);

  /* ---------- 自动聚焦 ---------- */
  setTimeout(function () {
    if (rememberEl.checked && passwordEl.value) loginBtn.focus();
    else if (usernameEl.value && !passwordEl.value) passwordEl.focus();
    else usernameEl.focus();
  }, 600);
})();
</script>
</body>
</html>
